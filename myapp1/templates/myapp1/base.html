<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Contacts{% endblock %}</title>
</head>
<body>
  {% if messages %}
    <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
  {% endif %}

  <nav>
    <a href="{% url 'contact_list' %}">Home</a> |
    <a href="{% url 'contact_create' %}">New Contact</a>
  </nav>
  <hr>

  {% block content %}{% endblock %}
</body>
</html>
